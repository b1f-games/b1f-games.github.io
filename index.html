html,body{margin:0;height:100%;background:#0c0c12;color:#999;font-family:"DotGothic16",monospace;overscroll-behavior:none}
body{display:flex;flex-direction:column;align-items:center;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}

#ab{display:flex;gap:16px;align-items:flex-end}
.rb{width:70px;height:70px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#e05050,#901818);color:#fff;font:bold 22px monospace;touch-action:none;padding:0}
.rb.bb{background:radial-gradient(circle at 35% 30%,#8088a0,#3c4050);margin-bottom:-22px}

#shb{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}

function updBattle(){
  if(bt.shake>0)bt.shake--;if(bt.hurt>0)bt.hurt--;
  if(bt.lock>0){bt.lock--;queue.length=0;return;}
  const k=queue.shift();if(!k)return;
  if(bt.phase=='msg'){if(k=='a'||k=='b'){sfx('tick');next();}return;}
  if(bt.phase=='choice'){
    if(k=='a'){sfx('buy');bt.phase='msg';bt.msg='';choose(bt.ch==0);}
    else if(k!='b'){bt.ch^=1;sfx('tick');}
    return;
  }
  bt.note='';
  if(bt.sub){
    const L=bt.sub.list;
    if(k=='up')bt.sub.i=(bt.sub.i+L.length-1)%L.length;
    else if(k=='down')bt.sub.i=(bt.sub.i+1)%L.length;
    else if(k=='b')bt.sub=null;
    else if(k=='a'){const it=L[bt.sub.i];bt.sub=null;it.fn();}
    return;
  }
  if(k=='left'||k=='right'){bt.ci^=1;sfx('tick');}
  else if(k=='up'||k=='down'){bt.ci^=2;sfx('tick');}
  else if(k=='a'){
    sfx('tick');
    if(S.sin>=75&&bt.ci!=0&&Math.random()<.3){heroAttack(1.3,T(832,'体が 勝手に 動いた!'));return;}
    if(bt.ci==0)heroAttack(1,T(833,'あなたの こうげき!'));
    else if(bt.ci==1){const L=skillList();if(!L.length)bt.note=T(834,'まだ 何も\nおぼえていない。');else bt.sub={list:L,i:0};}
    else if(bt.ci==2){const L=itemList();if(!L.length)bt.note=T(835,'何も 持っていない。');else bt.sub={list:L,i:0};}
    else{
      const e=bt.e;
      bt.steps.push(()=>{if(e.boss||e.mid){enemySteps();return T(836,'にげられない!');}if(S.sin>=75){enemySteps();return T(837,'足が 敵のほうへ\n向いてしまう!');}if(Math.random()<.7){bt.steps.push(()=>{endBattle('flee');});return T(838,'うまく にげきった。');}enemySteps();return T(839,'にげられなかった!');});
      next();
    }
  }
}

  if(k=='b'){menu={i:0,msg:''};sfx('tick');setMode('menu');return;}
  let d=k=='down'?0:k=='left'?1:k=='right'?2:k=='up'?3:-1;

function update(){

    if(mode=='share'){if(k=='b')shareClose();return;}

      if(k=='up'||k=='down'){title.ls.i=(title.ls.i+(k=='up'?n-1:1))%n;sfx('tick');}

      return;}
    if(mode=='title'){
      const IT=titleItems(),n=IT.length,it=IT[title.i%n];
      if(k=='up'||k=='down'){title.i=(title.i+(k=='up'?n-1:1))%n;sfx('tick');}

      else if(k=='a'&&it=='lang'){const LS=window.__LANGS||[];title.ls={i:Math.max(0,LS.findIndex(x=>x[0]==window.__LANG))};sfx('tick');}
      else if(k=='a'){

        mv=null;steps=0;
        if(cont){S.carry=S.carry||{};S.name=S.name||T(380,'ナギ');if(S.depth>0&&S.mapv!=2){S.x=ENT[S.depth][0];S.y=ENT[S.depth][1];S.px=null;}S.mapv=2;dim();setMode('map');music(mapSong());banner=150;}

      else if(k!='b'){dec.i^=1;sfx('tick');}
    }else if(mode=='shop'){
      const L=shop.list,n=L.length+1;
      if(k=='up'){shop.i=(shop.i+n-1)%n;sfx('tick');}
      else if(k=='down'){shop.i=(shop.i+1)%n;sfx('tick');}
      else if(k=='b'){setMode('map');}
      else if(k=='a'){if(shop.i==L.length)setMode('map');else buy(L[shop.i]);}
    }else if(mode=='menu'){
      const L=menuList(),n=L.length;if(menu.i>=n)menu.i=n-1;
      if(k=='up'){menu.i=(menu.i+n-1)%n;sfx('tick');}
      else if(k=='down'){menu.i=(menu.i+1)%n;sfx('tick');}
      else if(k=='b'){setMode('map');}
      else if(k=='a'){const it=L[menu.i];if(it.close)setMode('map');else if(it.dbg){setMode('map');debugTools();}else if(it.purge){menu.msg=purge();if(fallCheck())return;}else{const r=useItem(it.id);if(mode=='menu')menu.msg=r;}}
    }else if(mode=='ask'){

      if(k=='up'){ask.i=(ask.i+n-1)%n;sfx('tick');}
      else if(k=='down'){ask.i=(ask.i+1)%n;sfx('tick');}
      else if(k=='a'){const a=ask;ask=null;sfx('buy');setMode('map');a.cb(a.i);}
    }
  }
}

function draw(ts){
  time=ts;ctx=G;G.setTransform(HR,0,0,HR,0,0);G.globalAlpha=1;G.imageSmoothingEnabled=false;
  let wave=0;
  if(mode=='title')sceneTitle();
  else if(mode=='battle')sceneBattle();
  else{sceneMap();try{atmo();}catch(e){}if(S.depth>=4)wave=2;if(sinkT>0)wave=Math.max(wave,Math.round(sinkT/56*9));}
  U.setTransform(1,0,0,1,0,0);U.imageSmoothingEnabled=false;U.globalAlpha=1;
  if(wave){for(let y=0;y<H;y++){const off=Math.round(Math.sin(y/13+time/450)*wave);U.drawImage(scn,0,y*HR,W*HR,HR,(off-2)*SC,y*SC,(W+4)*SC,SC);}}
  else{const sx=shk>0?((shk&2)?-1:1)*Math.ceil(shk/3)*SC:0,sy=shk>0?((shk&1)?1:-1)*Math.ceil(shk/4)*SC:0;if(sx||sy){U.fillStyle='#07060c';U.fillRect(0,0,W*SC,H*SC);}U.drawImage(scn,sx,sy,W*SC,H*SC);}
  U.setTransform(SC,0,0,SC,0,0);ctx=U;U.textBaseline='top';
  if(sinkT>0&&mode!='battle'&&mode!='title'){U.globalAlpha=Math.min(1,sinkT/56*1.1);R('#07060c',0,0,W,H);U.globalAlpha=1;}
  if(mode=='title')uiTitle();
  else if(mode=='battle')uiBattle();
  else{
    if(cut){R('#07060c',0,0,W,H);if(CUT[cut])U.drawImage(CUT[cut],0,8);const a=1-(time-cutT)/600;if(a>0){U.globalAlpha=a;R('#07060c',0,0,W,H);U.globalAlpha=1;}}else{
    if(flash>0){U.globalAlpha=flash/24;R('#000',0,0,W,H);U.globalAlpha=1;}
    uiHud();}
    if(mode=='dialog')uiDialog();else if(mode=='shop')uiShop();else if(mode=='menu')uiMenu();else if(mode=='decide')uiDecide();else if(mode=='ask')uiAsk();
  }
}
let last=0,acc=0;
// ---- 空気感: 光・影・粒（高精細の画面に描く。遊びには影響しない） ----
let camX=0,camY=0,camZ=[0,0];const AMB=[];let ambD=-1,ambSrc=null,ambDep=-1;
function ambSources(d){const M=maps[d],o=[];for(let y=0;y<M.length;y++)for(let x=0;x<M[0].length;x++){const t=M[y][x];
  if(t=='V')o.push([x*16+8,y*16+4,34,'255,236,170',.5]);else if(t=='m'||t=='D')o.push([x*16+8,y*16+14,22,'255,226,160',.32]);else if(t=='B'&&d==0&&hash(x,y,9)<.35)o.push([x*16+8,y*16+8,12,'255,214,150',.22]);else if(t=='X'||t=='U')o.push([x*16+8,y*16+8,40,'150,90,255',.45]);}return o;}
function atmo(){
  const d=S.depth;if(ambDep!=d||ambSrc==null){ambDep=d;ambSrc=ambSources(d);AMB.length=0;}
  const t=time/1000,dark=d>=1;G.save();
  // 光源（自販機、店先、窓、裂け目）
  G.globalCompositeOperation='lighter';
  for(const L of ambSrc){const x=L[0]-camX,y=L[1]-camY;if(x<-50||y<-50||x>W+50||y>H+50)continue;const fl=.9+.1*Math.sin(t*7+L[0]);const g=G.createRadialGradient(x,y,0,x,y,L[2]);g.addColorStop(0,'rgba('+L[3]+','+(L[4]*fl*(dark?1.2:.8))+')');g.addColorStop(1,'rgba('+L[3]+',0)');G.fillStyle=g;G.fillRect(x-L[2],y-L[2],L[2]*2,L[2]*2);}
  G.globalCompositeOperation='source-over';
  // 主人公のまわりの明るさ（下の層だけ）
  const px=S.x*16+8-camX+(mv?DX[S.dir]*mv.t*2:0),py=S.y*16+6-camY+(mv?DY[S.dir]*mv.t*2:0);
  // 全体の色合いと周辺の暗さ
  if(d==0){const g=G.createLinearGradient(0,0,W,H);g.addColorStop(0,'rgba(255,190,120,.10)');g.addColorStop(.55,'rgba(255,190,120,0)');g.addColorStop(1,'rgba(40,30,90,.16)');G.fillStyle=g;G.fillRect(0,0,W,H);}
  const v=G.createRadialGradient(dark?px:W/2,dark?py:H/2,dark?40:90,dark?px:W/2,dark?py:H/2,dark?170:190);v.addColorStop(0,'rgba(7,6,12,0)');v.addColorStop(1,dark?'rgba(7,6,12,.62)':'rgba(20,14,40,.34)');G.fillStyle=v;G.fillRect(0,0,W,H);
  if(dark){for(let k=0;k<3;k++){const fx=((t*6*(k+1)+k*97)%(W+160))-80,fy=40+k*60+Math.sin(t*.4+k)*10,g=G.createRadialGradient(fx,fy,0,fx,fy,70);g.addColorStop(0,'rgba(120,110,150,.07)');g.addColorStop(1,'rgba(120,110,150,0)');G.fillStyle=g;G.fillRect(fx-70,fy-70,140,140);}}
  // 水面のきらめき（細かい1画素）
  const M=maps[d],x0=Math.max(0,camX>>4),y0=Math.max(0,camY>>4);
  for(let ty=y0;ty<=y0+VH&&ty<M.length;ty++)for(let tx=x0;tx<=x0+VW&&tx<M[0].length;tx++)if(M[ty][tx]=='W'){for(let k=0;k<3;k++){const ph=hash(tx,ty,k+20)*6.28,a=Math.sin(t*2.2+ph);if(a>.6){G.fillStyle='rgba(235,255,255,'+((a-.6)*1.6)+')';G.fillRect(tx*16-camX+hash(tx,ty,k)*14+1,ty*16-camY+hash(tx,ty,k+5)*13+2,1.5,.5);}}}
  // 漂う粒（地上は葉、下の層はほこり）
  while(AMB.length<(dark?26:12))AMB.push({x:camX+Math.random()*W,y:camY+Math.random()*H,s:Math.random(),p:Math.random()*6.28});
  for(const a of AMB){if(dark){a.y-=.08+a.s*.1;a.x+=Math.sin(t+a.p)*.08;}else{a.y+=.18+a.s*.15;a.x+=.25+Math.sin(t*1.5+a.p)*.3;}
    let x=a.x-camX,y=a.y-camY;if(x<-8||x>W+8||y<-8||y>H+8){a.x=camX+(dark?Math.random()*W:Math.random()*W-20);a.y=camY+(dark?H+4:-4);if(!dark&&Math.random()<.4){a.x=camX-4;a.y=camY+Math.random()*H;}continue;}
    if(dark){G.fillStyle='rgba(200,190,230,'+(.25+.25*Math.sin(t*2+a.p))+')';G.fillRect(x,y,.5,.5);}
    else{const r=Math.sin(t*3+a.p);G.fillStyle=a.s<.5?'#c8783a':'#a0b048';G.fillRect(x,y,1+.5*Math.abs(r),.5);G.fillStyle='rgba(60,30,20,.5)';G.fillRect(x+.5,y+.5,.5,.5);}}
  G.restore();}
// ---- 演出（手ざわり）：数字・粒・揺れ・切り替え ----
const POP=[],PART=[];let shk=0,btIn=0,sinkT=0,dlgT=0,dlgN=0,lastBt=null,lastEH=0,lastPH=0;
function popNum(v,x,y,c){POP.push({v:String(v),x:x,y:y,c:c,t:0});}
function burst(x,y,n,c,up){for(let i=0;i<n;i++){const a=Math.random()*6.283,sp=.5+Math.random()*1.8;PART.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(up?1.2:0),t:0,life:16+rnd(16),c:c,up:up});}}
function fxTick(){
  if(shk>0)shk--;if(btIn>0)btIn--;if(sinkT>0)sinkT--;
  for(let i=POP.length-1;i>=0;i--){POP[i].t++;if(POP[i].t>48)POP.splice(i,1);}
  for(let i=PART.length-1;i>=0;i--){const q=PART[i];q.t++;q.x+=q.vx;q.y+=q.vy;q.vy+=q.up?-.02:.07;if(q.t>q.life)PART.splice(i,1);}
  if(mode=='battle'&&bt&&S){
    if(bt!==lastBt){lastBt=bt;lastEH=bt.e.hp;lastPH=S.hp;btIn=26;POP.length=0;PART.length=0;}
    const eh=bt.e.hp;
    if(eh<lastEH){popNum(Math.min(lastEH,lastEH-eh),120,58,'#fff4c0');burst(120,88,12,'#f8f0ff');shk=Math.max(shk,5);bt.wf=5;}
    else if(eh>lastEH&&lastEH>0)popNum('+'+(eh-lastEH),120,58,'#8ff0c0');
    lastEH=eh;
    if(S.hp<lastPH){popNum(lastPH-S.hp,58,44,'#ff8868');shk=Math.max(shk,9);}
    else if(S.hp>lastPH)popNum('+'+(S.hp-lastPH),58,44,'#8ff0c0');
    lastPH=S.hp;
    if(bt.wf>0)bt.wf--;
    if(bt.dead){if(!bt.dT){bt.dT=1;burst(120,96,22,'#2a1c40',1);burst(120,96,12,'#c8a8f8',1);}else if(bt.dT<40)bt.dT++;}
  }else lastBt=null;
}
function fxDraw(){
  for(const q of PART){U.globalAlpha=Math.max(0,1-q.t/q.life);R(q.c,Math.round(q.x),Math.round(q.y),2,2);}
  U.globalAlpha=1;
  for(const q of POP){const k=q.t,dy=k<10?-k*1.2:-12-(k-10)*.25,a=k<32?1:Math.max(0,1-(k-32)/16);U.globalAlpha=a;
    const w=tw(q.v);U.save();U.translate(Math.round(q.x-w),Math.round(q.y+dy));U.scale(2,2);txt(q.v,0,0,q.c);U.restore();}
  U.globalAlpha=1;
}
let ffT=0;function ffTick(){if(held.a&&mode=='battle'&&bt&&bt.phase=='msg'&&!(bt.lock>0)){ffT++;if(ffT>18&&ffT%7==0&&!queue.length)queue.push('a');}else if(!held.a)ffT=0;}
function frame(ts){
  if(!last)last=ts;acc+=Math.min(100,ts-last);last=ts;
  while(acc>=16.6){update();ffTick();fxTick();acc-=16.6;if(S&&mode!='title')S.pt=(S.pt||0)+.0166;}
  draw(ts);requestAnimationFrame(frame);
}

/* ---------- 入力 ---------- */
function press(k){audioInit();if(!held[k]){held[k]=true;queue.push(k);if(queue.length>4)queue.shift();}}
function release(k){held[k]=false;}
const KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',z:'a',Z:'a',Enter:'a',' ':'a',x:'b',X:'b',Escape:'b'};
window.addEventListener('keydown',e=>{const k=KEYS[e.key];if(!k)return;e.preventDefault();if(!e.repeat)press(k);});
window.addEventListener('keyup',e=>{const k=KEYS[e.key];if(k)release(k);});
document.querySelectorAll('.rb').forEach(el=>{
  const k=el.dataset.k;
  el.addEventListener('pointerdown',e=>{e.preventDefault();press(k);});
  ['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,()=>{release(k);audioInit();}));
});
const dp=document.getElementById('dpad');let dcur=null;
function dpDir(e){const r=dp.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);if(Math.hypot(dx,dy)<10)return null;return Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');}
function dpSet(k){if(k===dcur)return;if(dcur)release(dcur);dcur=k;if(k)press(k);}
dp.addEventListener('pointerdown',e=>{e.preventDefault();try{dp.setPointerCapture(e.pointerId);}catch(x){}dpSet(dpDir(e));});
dp.addEventListener('pointermove',e=>{if(dcur!==null||e.buttons)dpSet(dpDir(e));});
['pointerup','pointercancel'].forEach(n=>dp.addEventListener(n,()=>{dpSet(null);audioInit();}));

if(LANG_EN){document.querySelector('#sub span').textContent=T(879,'PC：矢印キー／Z＝A／X＝B');snd.textContent=T(880,'音 ON');document.documentElement.lang=window.__LANG||'en';document.getElementById('nmb').textContent=T(881,'けってい');document.getElementById('nmi').maxLength=8;}

  for(let q=0;q<ov.length;q+=3){const im=OVI[d][ov[q]];X.drawImage(im,ov[q+1]+8-(im.width>>1),ov[q+2]+16-im.height);}
  X.fillStyle='#ff3060';for(const n of NPCS[d])X.fillRect(n.x*16+5,n.y*16+5,6,6);return c.toDataURL();},get cut(){return cut;},KP:KP,GATE:GATE,XT:XT,ending:i=>ending(i),trueEnd:()=>MIDWIN.boss2(),dbg:(d,o)=>debugSet(d,o),QUESTS:QUESTS,get ask(){return ask;},ENT:ENT,EXT:EXT,SPOT:SPOT,CHP:CHP,FX:FX,NPCS:NPCS,mbTalk:mbTalk,interact:interact,get S(){return S;},get mode(){return mode;},get bt(){return bt;},maps:maps,press:press,release:release,startBattle:startBattle,warp:warp,EN:EN,music:music,get step(){return stepI;},get audio(){return AC?AC.state:'none';},get smp(){return {playing:!!smpNode,loaded:!!SAMPLE.battle.buf,all:Object.keys(SAMPLE).filter(q=>SAMPLE[q].buf),failed:!!SAMPLE.battle.failed,synth:!!song};}};
toTitle();
requestAnimationFrame(frame);
})();
